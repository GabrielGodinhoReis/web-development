<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Contato</title>
</head>
<body>
    
    <h1><font color="black">Contato</font></h1>

    <p><i>Seja bem vindo, preencha o <strong>formulário</strong> abaixo para:</i></p>

    <ul>
    <li>Duvidas</li>
    <li>Sugestões</li>
    <li>Criticas</li>
    <li>Orçamentos</li>
    </ul>

    <p>Caso queira ver nossos produtos, clique <a href="https://www.youtube.com/watch?v=yQ9Ydz7jo6I">aqui</a></p>

    <p>Nome:
        <input type="text" placeholder="Digite seu nome" size="30" required>
    </p>

    <p>Email:
        <input type="email" placeholder="Digite seu email" size="30" required>
    </p>

    <p>Telefone:
        <input type="tel" maxlength="15" placeholder="Digite seu Telefone | (11) 99999-9999" size="30" required>
    </p>

    <p>Assuntos:
    <select>
        <option>Duvidas</option>
        <option>Sugestões</option>
        <option>Criticas</option>
        <option>Orçamentos</option>
    </select>
    </p>

    <p>Deseja receber uma copia deste email:
        <input type="radio" name="option"> Sim
        <input type="radio" name="option"> Não
    </p>

    <p>Mensagem:
    <textarea rows="5" size="30" placeholder="Digite sua mensagem"></textarea>
    </p>

    <a href="https://www.youtube.com/watch?v=Qo8VOF3hmqE">
    <button type="button">Enviar</button>
    </a>

</body>
